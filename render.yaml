# Render Blueprint — Next.js를 일반 Node 서버로 실행
# (Vercel 서버리스의 ~60초 함수 시간 제한이 없음 → 긴 답변도 안 끊김)
#
# 사용법: Render 대시보드 → New → Blueprint → 이 GitHub 저장소 연결
#         → 아래 sync:false 환경변수들을 입력 → Apply → 배포
services:
  - type: web
    name: uz-chat
    runtime: node
    plan: free
    region: singapore # 한국에서 가까운 리전
    buildCommand: npm install && npm run build
    startCommand: npm run start # next start 는 PORT 환경변수를 자동 인식
    healthCheckPath: /
    autoDeploy: true # main 브랜치 push 시 자동 재배포 (Vercel과 동일)
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ↓ 값은 Render 대시보드에서 직접 입력 (절대 저장소에 커밋하지 않음)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_CODE # 대문 접속 코드(8자리 숫자) — 미설정 시 게이트 꺼짐
        sync: false
      - key: BLOCK_FOREIGN_IPS # "1" 이면 국내 IP 대역 외 접근 차단 (미설정 시 꺼짐)
        value: "1"
      - key: BLOB_READ_WRITE_TOKEN # 큰 파일 첨부 쓸 때만 (없으면 비워둬도 됨)
        sync: false
      - key: CRON_SECRET # 정기 정리용 — 값은 직접 정하는 임의 문자열 (아래 "정기 파일 정리" 참고)
        sync: false
# ── 콜드 스타트 회피(keep-alive) ─────────────────────────────────────────────
# 무료 플랜은 15분 유휴 후 잠들고, 다시 깨는 데 30~60초가 걸린다.
# 외부 cron 서비스로 주기적으로 깨워 두면 없앨 수 있다.
#
#   서비스   : cron-job.org (무료 + 시간대 지정 가능)
#   대상 URL : https://<서비스>.onrender.com/   ← 반드시 '/' (API 경로 아님)
#   타임존   : Asia/Seoul
#   시(hour) : 7 ~ 21        분(minute): 0,10,20,30,40,50
#              → 마지막 핑 21:50, 22:05경 잠듦. 하루 약 15시간.
#
# UptimeRobot 무료 플랜은 쓰지 말 것 — 시간대 제한(Maintenance Windows)이 유료라
# 24시간 핑밖에 안 되고, 그러면 아래 750시간 한도에 걸린다. (유료로 사더라도 그
# 기능은 '알림 억제'가 목적이라 체크가 계속되면 시간은 그대로 소모된다)
#
# '/' 를 쓰는 이유: proxy matcher에서 제외돼 있어 해외 모니터링 IP도 차단되지 않고,
# Anthropic·Supabase를 전혀 호출하지 않아 토큰·DB 비용이 0이며, 접속 로그
# (recordAccess)에도 남지 않아 관리자 통계가 오염되지 않는다.
#
# ⚠️ 24시간 핑은 하지 말 것. 무료 인스턴스 시간은 워크스페이스당 월 750시간인데
#    24시간 유지는 31일 달에 744시간이라 여유가 6시간뿐이다. 초과하면 다음 달까지
#    서비스가 정지된다. 07~22시(월 약 465시간)면 충분한 여유가 남는다.
#    시간대 밖의 첫 접속자만 콜드 스타트를 겪는다.
#
# ⚠️ src/proxy.ts 의 matcher에 '/' 를 추가하면 이 핑과 Render 헬스체크가 함께
#    깨진다 (해외 IP로 판정돼 403). matcher는 API 경로만 잡도록 유지할 것.
#
# ── 정기 파일 정리(/api/cleanup) ─────────────────────────────────────────────
# ⚠️ vercel.json 에 크론이 정의돼 있지만 그건 Vercel 배포 전용이다. Render는
#    vercel.json 을 읽지 않으므로, 아래 설정을 하지 않으면 정리가 아예 돌지 않는다.
#    (JSON 은 주석을 못 달고 Vercel 이 스키마 밖 키를 거부해서 경고를 여기에 남긴다)
#
# 무엇을 지우나: 첨부만 하고 전송하지 않은 파일은 Anthropic Files API 에 올라간 채
# 어떤 메시지도 참조하지 않아 영구히 남는다. 이 작업이 24시간 지난 그런 고아 파일을
# 지운다. 대화를 삭제할 때 참조 파일은 이미 정리되므로 누락 경로는 이것뿐이다.
# 덤으로 매일 messages 테이블을 조회하므로 Supabase 무료 플랜의 7일 유휴 정지도 막는다.
#
# 1) CRON_SECRET 값 만들기 — 발급받는 게 아니라 직접 정하는 임의의 문자열:
#      node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
# 2) Render 대시보드 → 서비스 → Environment → CRON_SECRET 에 그 값을 저장
#    (저장하면 자동 재배포되어 1~2분 끊긴다)
# 3) cron-job.org 에 keep-alive 와 별개인 작업을 하나 더 만든다:
#      URL     : https://<서비스>.onrender.com/api/cleanup   ← api 가 앞, cleanup 이 뒤
#      스케줄  : 매일 1회 (예: 03:00, Asia/Seoul)
#      헤더    : Key=Authorization  Value=Bearer <위 값>
#                ('Bearer' 는 값 쪽에 있어야 한다. 앞뒤 공백·줄바꿈이 붙으면 401)
#
# 확인: 성공하면 {"totalFiles":n,"referenced":n,"deleted":n,"skipped":n,"errors":n}
#       {"error":"unauthorized"} 면 값 불일치 또는 재배포 미완료.
#       404 면 URL 오타 (경로는 /api/cleanup).
# 이 경로는 proxy matcher에서 제외돼 있어 해외 크론 서비스에서 호출해도 차단되지 않는다.
