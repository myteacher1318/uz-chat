# Render Blueprint — Next.js를 일반 Node 서버로 실행
# (Vercel 서버리스의 ~60초 함수 시간 제한이 없음 → 긴 답변도 안 끊김)
#
# 사용법: Render 대시보드 → New → Blueprint → 이 GitHub 저장소 연결
#         → 아래 sync:false 환경변수들을 입력 → Apply → 배포
services:
  - type: web
    name: uz-chat
    runtime: node
    plan: free
    region: singapore # 한국에서 가까운 리전
    buildCommand: npm install && npm run build
    startCommand: npm run start # next start 는 PORT 환경변수를 자동 인식
    healthCheckPath: /
    autoDeploy: true # main 브랜치 push 시 자동 재배포 (Vercel과 동일)
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ↓ 값은 Render 대시보드에서 직접 입력 (절대 저장소에 커밋하지 않음)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_CODE # 대문 접속 코드(8자리 숫자) — 미설정 시 게이트 꺼짐
        sync: false
      - key: BLOCK_FOREIGN_IPS # "1" 이면 국내 IP 대역 외 접근 차단 (미설정 시 꺼짐)
        value: "1"
      - key: BLOB_READ_WRITE_TOKEN # 큰 파일 첨부 쓸 때만 (없으면 비워둬도 됨)
        sync: false
      - key: CRON_SECRET # 정기 정리용 (Render에선 별도 Cron 필요 — 아래 설명)
        sync: false
# ── 콜드 스타트 회피(keep-alive) ─────────────────────────────────────────────
# 무료 플랜은 15분 유휴 후 잠들고, 다시 깨는 데 30~60초가 걸린다.
# 외부 모니터링(UptimeRobot·cron-job.org 등)으로 주기적으로 깨워 두면 없앨 수 있다.
#
#   대상 URL : https://<서비스>.onrender.com/   ← 반드시 '/' (API 경로 아님)
#   주기     : 10~14분 (15분 유휴 한도보다 짧게)
#   시간대   : 매일 07:00~22:00 (한국 시간)
#
# '/' 를 쓰는 이유: proxy matcher에서 제외돼 있어 해외 모니터링 IP도 차단되지 않고,
# Anthropic·Supabase를 전혀 호출하지 않아 토큰·DB 비용이 0이며, 접속 로그
# (recordAccess)에도 남지 않아 관리자 통계가 오염되지 않는다.
#
# ⚠️ 24시간 핑은 하지 말 것. 무료 인스턴스 시간은 워크스페이스당 월 750시간인데
#    24시간 유지는 31일 달에 744시간이라 여유가 6시간뿐이다. 초과하면 다음 달까지
#    서비스가 정지된다. 07~22시(월 약 465시간)면 충분한 여유가 남는다.
#    시간대 밖의 첫 접속자만 콜드 스타트를 겪는다.
#
# ⚠️ src/proxy.ts 의 matcher에 '/' 를 추가하면 이 핑과 Render 헬스체크가 함께
#    깨진다 (해외 IP로 판정돼 403). matcher는 API 경로만 잡도록 유지할 것.
