# Render Blueprint — Next.js를 일반 Node 서버로 실행.
# 운영 절차(keep-alive 크론, 정기 정리, 환경변수 설명, 장애 대응)는 README.md 에 있다.
#
# 사용법: Render 대시보드 → New → Blueprint → 이 GitHub 저장소 연결
#         → 아래 sync:false 환경변수들을 입력 → Apply → 배포
services:
  - type: web
    name: uz-chat
    runtime: node
    plan: free
    region: singapore # 한국에서 가까운 리전
    buildCommand: npm install && npm run build
    startCommand: npm run start # next start 는 PORT 환경변수를 자동 인식
    # ⚠️ '/' 는 src/proxy.ts 의 matcher 에서 일부러 제외돼 있다. 여기에 차단이 걸리면
    #    이 헬스체크와 keep-alive 핑이 해외 IP 로 판정돼 403 을 받는다 (README 참고).
    healthCheckPath: /
    autoDeploy: true # main 브랜치 push 시 자동 재배포
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ↓ 값은 Render 대시보드에서 직접 입력 (절대 저장소에 커밋하지 않음)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD # /admin 로그인 비밀번호
        sync: false
      - key: ACCESS_CODE # 대문 접속 코드(8자리 숫자). 프로덕션에서 비우면 채팅이 '닫힘'
        sync: false
      - key: COOKIE_SECRET # 게이트·관리자 쿠키 서명 키 — 길고 임의의 문자열 (README 의 생성 명령)
        sync: false
      - key: BLOCK_FOREIGN_IPS # "1" 이면 국내 IP 대역 외 접근 차단 (미설정 시 꺼짐)
        value: "1"
      - key: BLOB_READ_WRITE_TOKEN # 큰 파일(2MB 초과) 첨부 쓸 때만 (없으면 비워둬도 됨)
        sync: false
      - key: CRON_SECRET # 정기 정리(/api/cleanup) 인증 — 직접 정하는 임의 문자열
        sync: false
      # 선택 항목 (필요할 때만 대시보드에서 추가):
      #   ALLOW_OPEN_GATE=1   ACCESS_CODE 없이 일부러 열어 두고 싶을 때 (유료 채팅 공개 주의)
      #   CLIENT_IP_HEADER    접속자 IP 헤더를 강제 지정 (기본: cf-connecting-ip, README 참고)
